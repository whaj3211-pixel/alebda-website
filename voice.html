<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الصوت | الإبداع</title>

    <style>
        body {
            background: linear-gradient(135deg, #101820, #243b55);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h2 {
            color: #00d4ff;
            margin: 30px 0;
        }

        .audio-box {
            background-color: #1c3042;
            padding: 30px 15px;
            border: 2px solid #00d4ff;
            border-radius: 15px;
            max-width: 500px;
            margin: 30px auto;
        }

        audio {
            width: 100%;
            max-width: 400px;
        }

        hr {
            border: 1px solid #00d4ff;
            margin: 30px 0;
        }

        a {
            display: inline-block;
            background-color: #00d4ff;
            color: #101820;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
        }

        a:hover {
            background-color: white;
        }
    </style>
</head>

<body>

    <h2>🎵 الاستماع إلى الصوت</h2>

    <div class="audio-box">

        <p>مرحبًا بك في قسم الصوت 🎧</p>

        <audio controls preload="metadata">
            <source src="zo/n.mp3" type="audio/mpeg">
            متصفحك لا يدعم تشغيل الصوت.
        </audio>

    </div>

    <hr>

    <a href="index.html">🏠 الصفحة الرئيسية</a>

</body>
</html>
