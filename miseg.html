<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>معرض الصور</title>

    <style>
        body {
            background-color: #17212b;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h2 {
            color: #00d4ff;
            margin-bottom: 30px;
        }

        .images {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        img {
            width: 300px;
            max-width: 100%;
            height: 220px;
            object-fit: cover;
            border: 2px solid #00d4ff;
            border-radius: 12px;
        }

        hr {
            margin: 30px 0;
            border: 1px solid #00d4ff;
        }

        a {
            display: inline-block;
            background-color: #00d4ff;
            color: #17212b;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
        }

        a:hover {
            background-color: white;
        }
    </style>
</head>

<body>

    <h2>📸 معرض الصور</h2>

    <div class="images">

        <img src="imgs/1.jpg" alt="الصورة الأولى">

        <img src="imgs/2.jpg" alt="الصورة الثانية">

        <img src="imgs/3.jpg" alt="الصورة الثالثة">

    </div>

    <hr>

    <a href="index.html">الصفحة الرئيسية 🏠</a>

</body>
      
</html>
